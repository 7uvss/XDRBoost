name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Apple Silicon app
        run: ./build.sh
      - name: Validate app configuration and signature
        run: |
          plutil -lint Info.plist XDRBoost.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 XDRBoost.app
          test -s XDRBoost.app/Contents/Resources/AppIcon.icns
